<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>$title$ · The Human Edge</title>
<link rel="stylesheet" href="print.css">
<style>
.instr-head{border-bottom:1.5pt solid var(--ink);padding-bottom:10pt;margin-bottom:12pt}
.instr-head h1{border:0;padding:0;margin:6pt 0 2pt;font-size:26pt}
.instr-head .tag{font-family:var(--mono);font-size:7.5pt;letter-spacing:.16em;text-transform:uppercase;color:var(--coral);margin-top:4pt}
h1{font-size:16pt;margin:18pt 0 6pt;padding-top:7pt;border-top:1.5pt solid var(--ink)}
h2{font-size:13pt;margin:16pt 0 5pt;break-after:avoid}
h3{font-size:10.5pt;margin:11pt 0 3pt;break-after:avoid}
p{margin:0 0 6pt}
ul,ol{margin:0 0 7pt;padding-left:16pt}
li{margin:0 0 2pt}
table{break-inside:auto}
tr{break-inside:avoid}
td{height:auto}
code{font-family:var(--mono);font-size:8pt}
pre{font-family:var(--mono);font-size:7.8pt;line-height:1.5;background:#F7F6F2;border:.6pt solid var(--rule);padding:7pt 9pt;white-space:pre-wrap;color:var(--ink);margin:3pt 0 10pt}
pre code{font-size:inherit}
blockquote{margin:6pt 0 10pt;padding:6pt 10pt;background:#F7F6F2;border-left:2.5pt solid var(--gold)}
hr{border:0;border-top:.5pt solid var(--rule);margin:14pt 0}
@media screen{body{max-width:820px;margin:30px auto;padding:0 24px}}
</style>
</head>
<body>
<span class="doc-name">The Human Edge · $title$ · instructor only</span>
<header class="instr-head">
  <div class="kicker">Curtin Executive Education · The Human Edge</div>
  <h1>$title$</h1>
  <div class="tag">Instructor only · not for participants</div>
</header>
$body$
</body>
</html>
